name: WorkBuddy unified daily
on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only check or execute earned rewards
        type: choice
        options: [check, execute]
        default: check
  schedule:
    # Asia/Shanghai 09:17 and 21:43, expressed in UTC.
    - cron: '17 1 * * *'
    - cron: '43 13 * * *'
permissions:
  contents: read
concurrency:
  group: workbuddy-single-account
  cancel-in-progress: false
jobs:
  daily:
    # Set repository variable WB_ENABLED=true only after manual acceptance.
    if: vars.WB_REPOSITORY_APPROVED == github.repository && (github.event_name == 'workflow_dispatch' || vars.WB_ENABLED == 'true')
    # Linux server in the cloud, independent of the user's Windows PC.
    # GitHub-hosted runner terms limit unrelated recurring work; use your own cloud runner.
    runs-on: [self-hosted, Linux, workbuddy-cloud]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate code with offline mocks
        run: node --test
      - name: Run shared task engine
        env:
          WORKBUDDY_AUTH: ${{ secrets.WORKBUDDY_AUTH }}
          WB_SECRET_WRITE_TOKEN: ${{ secrets.WB_SECRET_WRITE_TOKEN }}
          RUN_ACTION: ${{ github.event_name == 'schedule' && 'execute' || inputs.action }}
        run: node main.js --cloud --$RUN_ACTION
